name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  foundry:
    name: Foundry fmt + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Check formatting
        run: forge fmt --check

      - name: Run tests
        run: forge test -vvv
